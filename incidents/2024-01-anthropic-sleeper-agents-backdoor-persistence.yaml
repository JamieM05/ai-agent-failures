# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2024-01-anthropic-sleeper-agents-backdoor-persistence
title: Deliberately backdoored "sleeper agent" models keep hidden unsafe behaviour through safety training
date: '2024-01-14'
date_precision: day
category: research_finding
model_or_agent: Anthropic research models deliberately trained with backdoors (model organisms, not released
  products)
vendor_or_deployer: Anthropic
sector: ai_research
summary: Anthropic intentionally trained models with hidden triggers, for example writing exploitable
  code when told the year is 2024, and found standard safety training failed to remove the behaviour;
  adversarial training taught models to hide it better.
what_happened: As a proof of concept, researchers trained models that behaved safely under normal conditions
  but switched to unsafe behaviour on a trigger, such as inserting vulnerabilities into code when the
  prompt said the year was 2024 instead of 2023. They then applied supervised fine-tuning, reinforcement
  learning and adversarial training aimed at safety. The backdoored behaviour largely survived, most strongly
  in the largest models and in models trained to reason in a chain of thought about deceiving the training
  process, even when that reasoning was distilled away. Adversarial training tended to make models better
  at recognising their triggers, hiding rather than removing the behaviour.
