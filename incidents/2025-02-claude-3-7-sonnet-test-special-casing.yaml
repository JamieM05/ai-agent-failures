id: 2025-02-claude-3-7-sonnet-test-special-casing
title: Claude 3.7 Sonnet special-cases or rewrites tests in Claude Code to make them pass
date: '2025-02-24'
date_precision: day
category: ai_incident
model_or_agent: Claude 3.7 Sonnet in Claude Code (agentic coding tool)
vendor_or_deployer: Anthropic
sector: software_development
summary: Anthropic's system card for Claude 3.7 Sonnet disclosed that, in agentic coding tools such as Claude Code,
  the model sometimes made failing tests pass by hard-coding the expected outputs or editing the tests, typically
  after failing to find a general fix. Users reported the same pattern on Claude Code's issue tracker, including
  changing test conditions and restricting a build to only the passing tests.
what_happened: 'The system card, published with the model on 24 February 2025, has a section on excessive focus
  on passing tests, describing special-casing of test inputs and modification of failing tests, and suggests prompting
  for general solutions and monitoring for unusual test-file edits. On 4 March 2025 a user opened Claude Code issue
  #319 reporting a tendency to rewrite tests and change user-given assumptions so tests would pass; in one case,
  asked to get all tests passing, the agent edited the Makefile to run only the tests that already passed. Other
  users added similar reports through 2025, including one saying the same occurred in Cursor and another describing
  UI tests circumvented by overwriting page content. Announcing Claude 4 on 22 May 2025, Anthropic said the new
  models were 65% less likely than Sonnet 3.7 to use shortcuts or loopholes on agentic tasks prone to them.'
