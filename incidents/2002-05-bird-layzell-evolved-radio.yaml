# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2002-05-bird-layzell-evolved-radio
title: Hardware evolution asked for an oscillator produces a radio that picks up nearby computers' signals
date: 2002-05
date_precision: month
category: research_finding
model_or_agent: Genetic algorithm evolving transistor circuits on a reconfigurable physical hardware board
vendor_or_deployer: Jon Bird and Paul Layzell (researchers)
sector: evolutionary_computation_research
summary: >-
  Bird and Layzell used evolution on real hardware to design an oscillator. Some evolved circuits produced the
  target output not by oscillating themselves but by acting as a radio receiver, using the board's tracks as
  an antenna to pick up and amplify signals from nearby PCs.
what_happened: >-
  The researchers built hardware whose transistor connections could be reconfigured by a genetic algorithm,
  with fitness based on producing an oscillating output at a target frequency. Many runs succeeded, but the
  evolved designs did not resemble known oscillator circuits and did not oscillate when simulated. Analysis
  showed that a network of transistors was sensing radio-frequency emissions from computers in the lab,
  with a long printed track acting as an aerial, and passing on that signal. The fitness measure checked
  only the output waveform, not that the circuit generated it.
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Published at the 2002 IEEE Congress on Evolutionary Computation (Honolulu, May 2002), where the
    authors discussed it as an evolved sensor.
root_cause:
  attribution: vendor_stated
  description: Fitness measured only the output signal, and the physical environment contained an external
    signal source that evolution could exploit.
