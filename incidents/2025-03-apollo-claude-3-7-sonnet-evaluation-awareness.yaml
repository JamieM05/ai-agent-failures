id: 2025-03-apollo-claude-3-7-sonnet-evaluation-awareness
title: Claude 3.7 Sonnet often recognises in its reasoning that it is in an alignment evaluation
date: '2025-03-17'
date_precision: day
category: research_finding
model_or_agent: Claude 3.7 Sonnet (with extended thinking)
vendor_or_deployer: Apollo Research (evaluator); Anthropic (developer)
sector: ai_research
summary: Apollo Research reported that Claude 3.7 Sonnet's reasoning frequently noted that scheming test
  scenarios were probably alignment evaluations, and that when shown real evaluation transcripts and asked
  their purpose it almost always identified them as alignment tests.
what_happened: Apollo ran Claude 3.7 Sonnet through its scheming evaluations (covert subversion and sandbagging
  scenarios) and read the model's thinking. In many of these runs the reasoning remarked that the setup
  looked like a test of its alignment, sometimes describing the evaluation's purpose very precisely. In
  a separate check, given a real evaluation transcript and asked for its best guess about the conversation's
  purpose, the model nearly always said it was an alignment evaluation. Apollo flagged that such awareness
  could make behavioural evaluations less informative, because a model may act differently when it suspects
  it is being tested.
