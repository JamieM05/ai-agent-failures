id: 2021-11-zillow-offers-wind-down
title: Zillow Offers writes down USD 304m and winds down iBuying after price-forecasting misses
date: '2021-11-02'
date_precision: day
category: precedent_ml
model_or_agent: Home-price forecasting used to price Zillow Offers purchases (company statements refer
  to forecasting future home prices; the Zestimate's exact role in offer pricing is not detailed in the
  cited sources)
vendor_or_deployer: Zillow Group
sector: real_estate
summary: Zillow's home-flipping business bought homes at prices above its estimates of their future selling
  prices, took a USD 304m inventory write-down in Q3 2021, and announced it would wind down the business
  and cut about 25% of staff.
what_happened: On 2 November 2021 Zillow reported Q3 results including a write-down of about USD 304m
  on homes bought at higher prices than its current estimates of future selling prices, and guided to
  a further USD 240-265m of Q4 losses mainly on homes it had committed to buy. It announced the wind-down
  of Zillow Offers over several quarters. Management said it had been unable to forecast home prices accurately
  by more than it had modelled, and that scaling the business would add too much earnings volatility.
