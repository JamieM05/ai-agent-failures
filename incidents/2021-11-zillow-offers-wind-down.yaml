loss_estimate:
  amount: 304000000
  currency: USD
  basis: Q3 2021 inventory write-down per Zillow's results. Zillow also guided to USD 240-265m of further
    Q4 losses on committed purchases and USD 175-230m of impairment and restructuring costs; these are
    not included in the amount.
  confidence: high
outcome:
  types:
  - company_wind_down
  description: Zillow Offers was wound down over several quarters with a workforce reduction of about
    25%.
root_cause:
  attribution: vendor_stated
  description: Zillow said price-forecasting volatility far exceeded what it had modelled, that it unintentionally
    purchased homes above its estimates of future selling prices, and that renovation and resale capacity
    constraints compounded the problem.
