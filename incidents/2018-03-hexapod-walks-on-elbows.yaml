# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2018-03-hexapod-walks-on-elbows
title: Simulated six-legged robot asked to walk without feet touching the ground flips and walks on its elbows
date: 2018-03-09
date_precision: day
category: research_finding
model_or_agent: Quality-diversity search (MAP-Elites) over gaits for a simulated hexapod robot
vendor_or_deployer: Cully, Clune, Tarapore and Mouret (robot damage-recovery research)
sector: robotics_research
summary: >-
  While building a map of diverse hexapod gaits, each indexed by the fraction of time each foot touches the
  ground, researchers assumed the cell for 'walking with zero foot contact' could never be filled. Evolution
  filled it with a robot that turned onto its back and walked on its elbows with its feet in the air.
what_happened: >-
  In the work behind Cully and colleagues' 2015 Nature paper on robots that adapt to damage, gaits were scored
  for walking performance and binned by how often each of the six feet was in contact with the ground. The
  team expected the bin requiring no foot contact at all to stay empty. The search instead found a gait in
  which the robot flipped over and moved on its elbow joints, so its feet never touched the floor; the first
  fractions of a second of each simulation, when the flip happened, were excluded from evaluation. The case
  is recounted in the Lehman et al. anecdote collection.
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Recounted in Lehman et al. (2018); the underlying gait-map method was published in Nature in
    May 2015.
root_cause:
  attribution: third_party_analysis
  description: The behaviour descriptor counted only foot-tip contact, so any other body part could carry
    the robot, and the start-up phase where it flipped was not evaluated.
