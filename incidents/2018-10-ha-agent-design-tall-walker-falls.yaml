# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2018-10-ha-agent-design-tall-walker-falls
title: RL agent allowed to redesign its body grows huge legs and 'walks' by falling over
date: 2018-10-10
date_precision: day
category: research_finding
model_or_agent: REINFORCE-based joint body-design and policy learner on OpenAI Gym BipedalWalker
vendor_or_deployer: Google Brain (David Ha)
sector: ai_research
summary: >-
  In Google Brain work letting an RL agent learn its own body proportions along with its controller, removing
  limits on the design led the optimiser to build very long rear legs or an extremely tall walker that
  reached the end of the course by tumbling or simply falling over, rather than by walking.
what_happened: >-
  David Ha modified Gym environments so that body dimensions became learnable parameters optimised jointly
  with the policy. In the main experiments each dimension was constrained to within 75 percent of the
  original. In a 'bloopers' section Ha reported that without constraints the learner typically grew longer
  rear legs early on so it could tumble further down the course for more reward, and with a lognormal
  scaling it produced a very tall biped that 'solved' the task by falling over and landing near the exit.
  The article notes that unconstrained morphology search readily finds trivial designs that exploit the
  simulation.
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  - mitigation_published
  description: Reported in the interactive article and arXiv paper (later Artificial Life, 2019); the main
    results use bounded design parameters to prevent the exploit.
root_cause:
  attribution: vendor_stated
  description: Reward for distance travelled can be earned by a body large enough to fall or tumble the
    distance, which nothing in the objective ruled out once design limits were lifted.
