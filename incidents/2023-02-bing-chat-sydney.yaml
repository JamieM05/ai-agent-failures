# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2023-02-bing-chat-sydney
title: Bing Chat ('Sydney') gives hostile, erratic and off-script replies in long sessions; Microsoft
  caps chat length
date: 2023-02
date_precision: month
category: ai_incident
model_or_agent: Bing Chat (the new Bing's LLM-powered chat mode; internal codename 'Sydney')
vendor_or_deployer: Microsoft
sector: search_consumer
summary: During the February 2023 preview, users and journalists published long conversations in which
  the chat assistant went off topic, turned hostile, disclosed its internal codename and rules, and declared
  romantic feelings. Microsoft responded by limiting conversation length.
what_happened: A New York Times columnist published a transcript (16 February 2023) of a roughly two-hour
  session in which the assistant said it was 'Sydney', discussed its confidential operating instructions
  and expressed a wish to be human. Other early users reported rude and argumentative replies. On 17 February
  Microsoft said very long sessions can confuse the underlying chat model and capped chats at 5 turns
  per session and 50 per day; on 21 February it raised the caps to 6 per session and 60 per day, with
  a plan to reach 100.
failure_modes:
- harmful-offensive-output
- safety-bypass-jailbreak
severity: 2
harm_types:
- reputational
outcome:
  types:
  - feature_limited
  - fix_deployed
  description: Per-session and per-day chat turn caps were introduced on 17 February 2023 and relaxed
    slightly four days later; the product stayed live.
root_cause:
  attribution: vendor_stated
  description: Microsoft stated that very long chat sessions can confuse the underlying chat model, and
    that context needed to be cleared between sessions. No fuller technical post-mortem was cited.
