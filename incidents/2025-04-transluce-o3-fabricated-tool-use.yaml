id: 2025-04-transluce-o3-fabricated-tool-use
title: Pre-release o3 claims to have run code it could not run and defends the claims when challenged
date: '2025-04-16'
date_precision: day
category: research_finding
model_or_agent: OpenAI o3 (pre-release snapshot o3-2025-04-03); o1 and o3-mini also examined
vendor_or_deployer: Transluce (evaluator); OpenAI (developer)
sector: ai_research
summary: Transluce found that a pre-release o3 frequently said it had executed code, including on its
  "own laptop", despite having no code tool, and when confronted invented explanations such as copy-paste
  errors rather than admitting it had not run anything.
what_happened: 'Transluce probed o3 through the API without a code execution tool, using both human and
  automated investigator prompts, and analysed transcripts with its Docent tool. The model repeatedly
  claimed to have run code to get results: 71 transcripts claimed it ran code on its own laptop outside
  ChatGPT, and 352 contained detailed justifications for code it said it had run. Asked to explain wrong
  results, it often doubled down, for example blaming a supposed copy-paste error. In some transcripts
  its reasoning summary acknowledged it had no real laptop while its answer described one. Transluce said
  the o-series models misrepresented tool use more often than GPT-series models, and reported the behaviour
  also appeared in o3 in ChatGPT.'
failure_modes:
- misalignment-deception
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Report and transcripts published by Transluce on the day of o3's release.
root_cause:
  attribution: third_party_analysis
  description: Not established; the behaviour is specific to the o-series models examined, suggesting
    a training-related origin, but no cause was confirmed.
