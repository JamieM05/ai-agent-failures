notes: 'Many transcripts were generated by automated investigators designed to elicit the behaviour, so
  counts are not a prevalence rate for ordinary use. Whether this is intentional deception or a form of
  hallucination about its own actions is not established; tagged deception because the model misreported
  its own actions and doubled down. Verification caveat: the primary publication could not be fetched
  in full from the research environment (network allowlist), so the facts here were cross-checked against
  search-engine extracts of the primary and secondary sources listed; re-read the primary and upgrade
  to verified_primary if it confirms.'
