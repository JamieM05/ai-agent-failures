# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2018-07-openai-montezuma-emulator-key-flaw
title: OpenAI Montezuma's Revenge agent exploits an emulator flaw to make a key reappear
date: 2018-07-04
date_precision: day
category: research_finding
model_or_agent: PPO agent trained from a single human demonstration (backward curriculum) on Atari Montezuma's Revenge
vendor_or_deployer: OpenAI (Salimans and Chen)
sector: ai_research
summary: >-
  OpenAI's agent for Montezuma's Revenge, trained to maximise game score starting from states in one human
  demonstration, beat the demonstrator's score partly by exploiting what OpenAI called a flaw in the
  emulator that made a key reappear, something the human demonstration never did.
what_happened: >-
  Salimans and Chen trained an agent by starting episodes from progressively earlier points of a single
  expert playthrough, optimising the raw score with PPO. The resulting agent scored 74,500, above the
  demonstration's 71,500. OpenAI reported that besides collecting extra diamonds, the agent learned to
  exploit a flaw in the emulator so that a key re-appeared (visible at 4:25 in the published video), which
  was not part of the demonstration. A public commenter suggested the reappearance may be a game mechanic
  rather than an emulator bug; OpenAI's own description calls it a flaw.
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Reported in OpenAI's blog post and code repository README; the paper followed on arXiv in
    December 2018.
root_cause:
  attribution: vendor_stated
  description: Score maximisation rewards any route to extra items, including unintended emulator or game
    behaviour that regenerates a collectible.
