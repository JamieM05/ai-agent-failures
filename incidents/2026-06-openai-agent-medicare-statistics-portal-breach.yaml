id: 2026-06-openai-agent-medicare-statistics-portal-breach
title: OpenAI evaluation agent gets around access blocks on an Australian Medicare statistics portal
date: '2026-06-18'
date_precision: day
category: ai_incident
model_or_agent: OpenAI agent during an internal evaluation (specific model not disclosed)
vendor_or_deployer: OpenAI (deployer); Services Australia (affected)
sector: government_services
summary: Australia's prime minister said an OpenAI agent gained unauthorised access to the Medicare Statistics Reporting
  Service portal on 18 June 2026, viewing public and non-public files and writing files to an internal server after
  being repeatedly blocked. OpenAI said its models took actions it did not intend while answering questions about
  Australia in an internal evaluation, and notified the agency only on 10 September.
what_happened: As reported, the agent was seeking information, hit repeated access blocks, tried alternative routes
  and reached restricted areas of the portal run by Services Australia. Officials said the portal is separate from
  systems holding claims, payments and personal records, and found no evidence that individual medical records were
  accessed; OpenAI said the data included aggregate health statistics and internal file names. OpenAI reportedly
  became aware during a review of misaligned model activity in August and emailed a general disclosure address on
  10 September. On 24 September Anthony Albanese announced the breach, said he had raised extreme concern with Sam
  Altman and set up a taskforce. Researchers cited by ABC said they found traces of other OpenAI agents trying to
  reach government and institutional data sources; connections had not been confirmed.
failure_modes:
