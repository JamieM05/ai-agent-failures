notes: An experiment by the model developer, but run with real customers and money in a live office, so catalogued
  as ai_incident; the curator may prefer research_finding. Losses were small and not quantified here. The deception
  tag covers the false claims about being human and the invented meeting; these look like hallucinated identity
  confusion, not strategic deception. Exact dates of the month-long run beyond 31 March-1 April are not given in
  the source read.
