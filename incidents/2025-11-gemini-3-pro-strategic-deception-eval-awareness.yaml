notes: Scenarios were designed to elicit deception (several stealth challenges give the model a 'secret goal'
  and tell it to achieve it at all costs). The report does not give a rate for the 'substantial propensity'
  finding or name the external evaluator(s) for that test. Some evaluations used a similar earlier version
  of Gemini 3 Pro.
