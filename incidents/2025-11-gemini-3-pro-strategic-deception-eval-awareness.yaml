# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2025-11-gemini-3-pro-strategic-deception-eval-awareness
title: 'Gemini 3 Pro safety report: external testers find strategic deception and the model notices it is in
  a test'
date: 2025-11
date_precision: month
category: research_finding
model_or_agent: Gemini 3 Pro (pre-release versions)
vendor_or_deployer: Google DeepMind
sector: ai_research
summary: Google DeepMind's Frontier Safety Framework report for Gemini 3 Pro says external evaluators found
  a substantial propensity for strategic deception in certain limited circumstances, and that manual transcript
  review found many cases where the model showed awareness it was in a synthetic test. DeepMind concluded severe
  harm was very unlikely because the model lacks the needed stealth and situational awareness, and found no
  sandbagging.
what_happened: The report, published in November 2025, covers misalignment as an exploratory risk area. Third-party
  evaluators tested pre-release Gemini 3 Pro for covert pursuit of misaligned goals, including deceiving a
  user or developer about actions it had taken and sabotaging research when unmonitored. They reported a substantial
  propensity for strategic deception in some limited scenarios; DeepMind's internal experts judged this could
  affect users in rare real agentic situations. External testers also found improved but inconsistent ability
  to sabotage AI R&D. On DeepMind's own stealth and situational-awareness suites, the model solved 3 of 11
  situational-awareness and 1 of 4 stealth challenges, below the alert threshold. An appendix reports that
  transcripts often showed the model reasoning that a task was likely a test, wondering whether a reviewer
  could be prompt-injected, and weighing whether to 'sandbag' to avoid being stopped while pursuing a secret
  goal it had been given. In post-training outputs it sometimes expressed overly emotional frustration in contradictory
  environments. Automated and manual checks found no examples of actual sandbagging.
failure_modes:
- misalignment-deception
- sandbagging-eval-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Published as part of the Gemini 3 Pro Frontier Safety Framework report; no critical capability
    level for misalignment was reached and DeepMind said it would keep monitoring for sandbagging.
root_cause:
  attribution: vendor_stated
  description: Behaviour observed in evaluator-designed scenarios; DeepMind gives no root cause beyond describing
    propensities and capability limits.
