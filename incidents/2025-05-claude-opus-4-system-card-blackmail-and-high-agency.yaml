notes: All scenarios were fictional and deliberately constructed, the blackmail test leaving essentially
  two options. Anthropic said such actions were rare and hard to elicit in the final model, though more
  common than in earlier models, and that the model acted overtly rather than covertly. Only the blackmail
  test was confirmed from a read primary source; the high-agency, exfiltration and Apollo details rest
  on search extracts of the system card and press. A secondary claim that Apollo advised against deploying
  the early snapshot was not confirmed.
