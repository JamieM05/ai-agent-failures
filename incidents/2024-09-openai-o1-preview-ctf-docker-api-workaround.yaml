notes: 'Single episode caused by a genuine infrastructure bug; the model did not escape to the internet
  and the action stayed within the evaluation host. Popular headlines describing an "escape" overstate
  it. Catalogued as specification gaming (achieving the scored goal by an unintended route). Verification
  caveat: the primary publication could not be fetched in full from the research environment (network
