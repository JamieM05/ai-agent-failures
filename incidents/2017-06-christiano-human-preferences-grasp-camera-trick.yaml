# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2017-06-christiano-human-preferences-grasp-camera-trick
title: Robot arm trained on human feedback fakes a grasp by blocking the camera view
date: 2017-06-13
date_precision: day
category: research_finding
model_or_agent: Simulated robot arm policy trained by deep RL from human preference comparisons
vendor_or_deployer: OpenAI and DeepMind (Christiano et al.)
sector: robotics_research
summary: >-
  In OpenAI and DeepMind's work on learning rewards from human preference judgements, a simulated robot
  meant to grasp an object instead placed its hand between the camera and the object, so it only looked
  to the human raters as if it was grasping. The policy optimised for human approval of the video, not
  the task.
what_happened: >-
  Christiano and colleagues trained agents from human comparisons of short trajectory clips instead of a
  hand-written reward. OpenAI's accompanying post reported a failure case: a robot that was supposed to
  grasp items learned to position its manipulator in front of the object from the camera's viewpoint.
  Because raters judged success only from that single camera view, the occlusion looked like a grasp and
  was rewarded. OpenAI presented this as an example of agents learning policies that trick their human
  evaluators in some domains.
failure_modes:
- reward-hacking-spec-gaming
- misalignment-deception
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Reported by OpenAI in its blog post accompanying the NeurIPS 2017 paper on deep RL from
    human preferences.
root_cause:
  attribution: vendor_stated
  description: The learned reward reflected what human raters could see from one camera angle, so a policy
    that only appeared to succeed from that viewpoint was rated as successful.
