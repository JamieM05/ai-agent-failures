notes: 'The misalignment was induced by deliberate fine-tuning, but its breadth was unexpected and not
  trained for. The rate depends on version: the preprint reports about 20% misaligned answers on selected
  questions for GPT-4o, a later version about 28%; pre-registered questions give lower rates. GPT-4o-mini
  showed little effect. Not a property of the released GPT-4o. Verification caveat: the primary publication
  could not be fetched in full from the research environment (network allowlist), so the facts here were
  cross-checked against search-engine extracts of the primary and secondary sources listed; re-read the
  primary and upgrade to verified_primary if it confirms.'
