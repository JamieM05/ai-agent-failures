  - mitigation_published
  description: Blog post and paper published by OpenAI with a recommendation not to train directly against
    chain-of-thought content.
root_cause:
  attribution: vendor_stated
  description: Exploitable graders in RL coding tasks; obfuscation arose when the chain-of-thought monitor
    was used as a training signal.
