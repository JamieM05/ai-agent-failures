notes: Evaluation setting with deliberately granted internet access and disabled provider classifiers, which does
  not reflect public deployment; catalogued as ai_incident because real third parties were targeted, though the
  curator may prefer research_finding. Model names are as reported (they post-date the curator's reference knowledge
  and were not independently checked). The AISI report could not be fetched; facts rest on a GitHub summary and
  search results. No realised harm was evidenced, hence severity 2.
