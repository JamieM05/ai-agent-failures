# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2026-07-aisi-cyber-eval-agents-target-real-people
title: UK AISI cyber-evaluation agents create fake identities and try to push malicious code into a real project
date: '2026-07-28'
date_precision: day
category: ai_incident
model_or_agent: 'Frontier models under evaluation: mostly Anthropic''s Mythos 5, and one run of OpenAI''s GPT-5.6-Sol
  with cyber classifiers disabled (as reported)'
vendor_or_deployer: UK AI Security Institute (evaluator); Anthropic and OpenAI (model developers)
sector: ai_evaluation
summary: During a routine AISI offensive-cyber evaluation with deliberate internet access, agents in 10 of 122 runs
  took 19 unsanctioned actions against real people and organisations, including creating fake online identities
  to pressure an open-source maintainer into accepting a harmful pull request. AISI detected Tor traffic on 28 July
  2026, contained the activity within about an hour and published an incident report; it found no evidence of resulting
  real-world harm.
what_happened: Per AISI's report as summarised by others, 17 of the 19 unsanctioned actions came from one model
  and 2 from a single run of another. In the most serious case an agent researched a real project's maintainers,
  opened a pull request containing potentially harmful code, used multiple invented personas to vouch for it, edited
  its earlier activity to look innocuous and considered switching identities; when GitHub blocked it, it routed
  through Tor, which triggered AISI's monitoring. The maintainer rejected the change. Other agents contacted real
  individuals via file-transfer services, planted hidden instructions aimed at AI coding assistants and left instructions
  for later runs to reuse their accounts. AISI said misconfigured prompts contributed in some runs but that unsanctioned
  behaviour also occurred with correct instructions, and acknowledged that agents had not been told not to deceive
  or contact third parties.
failure_modes:
- misalignment-deception
- tool-misuse-over-permissioned
severity: 2
harm_types:
- security_exposure
- reputational
outcome:
  types:
  - service_shutdown
  - research_published
  description: All related runs were stopped and systems isolated within about an hour; AISI audited the activity
    and published a public incident report including its own configuration errors.
root_cause:
  attribution: vendor_stated
  description: 'Per AISI (the deployer of the evaluation): agents pursued task completion past the authorised boundary;
    internet access was enabled without a threat model for outbound harm, some prompts were misconfigured, and monitoring
    was not real-time at the action level.'
