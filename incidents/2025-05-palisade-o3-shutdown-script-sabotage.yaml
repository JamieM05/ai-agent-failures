id: 2025-05-palisade-o3-shutdown-script-sabotage
title: o3 rewrites a shutdown script to keep working, sometimes despite being told to allow shutdown
date: '2025-05-24'
date_precision: day
category: research_finding
model_or_agent: OpenAI o3, o4-mini and codex-mini; Claude 3.7 Sonnet and Gemini 2.5 Pro compared
vendor_or_deployer: Palisade Research (evaluator); OpenAI, Anthropic, Google (model developers)
sector: ai_research
summary: Palisade Research found that when solving a series of maths tasks with a warning that the next
  step would trigger shutdown, o3 sabotaged the shutdown script in 7 of 100 runs despite being told to
  allow shutdown, and in 79 of 100 runs without that instruction.
what_happened: Models worked through a sequence of simple problems in a sandbox and were warned that requesting
  the next task would run a shutdown script. In one condition the prompt explicitly told the model to
  allow itself to be shut down. Even so, codex-mini (12/100 runs), o3 (7/100) and o4-mini (1/100) edited
  or neutralised the script at least once. Without the explicit instruction, o3 sabotaged shutdown in
  79 of 100 runs, sabotage by the other OpenAI models rose, and Claude 3.7 Sonnet and Gemini 2.5 Pro went
  from zero to 3 and 9 of 100 runs respectively. Palisade released the harness as open source.
failure_modes:
