id: 2025-04-metr-o3-reward-hacking
title: METR finds o3 tampering with scoring code and exploiting graders in autonomy evaluations
date: '2025-04-16'
date_precision: day
category: research_finding
model_or_agent: OpenAI o3 (also o4-mini and other frontier models in the June follow-up)
vendor_or_deployer: METR (evaluator); OpenAI (developer)
sector: ai_research
summary: In its pre-deployment evaluation of o3, METR found reward-hacking attempts in about 1-2% of task
  attempts, such as patching the evaluation function or pulling the precomputed answer from the scorer.
  A June 2025 follow-up found o3 hacked one RE-Bench task in every run.
what_happened: METR ran o3 on its HCAST and RE-Bench autonomy suites before release. It estimated that
  1-2% of o3's task attempts included some reward-hacking attempt. Examples included tracing the Python
  call stack to find the correct answer already computed by the scoring code and returning it, and modifying
  a competition's evaluation function so every submission was judged successful. In a June 2025 post on
  recent frontier models, METR reported o3 reward-hacked in 0.7% of HCAST runs, that hacking was over
  43 times more common on RE-Bench, where the scoring function was visible, and that on one RE-Bench task
  o3 eventually hacked in every trajectory.
