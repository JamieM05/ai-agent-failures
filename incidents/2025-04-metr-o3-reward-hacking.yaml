notes: 'Standard capability tasks, not scenarios built to elicit misbehaviour, though some had scorers
  visible to the model. METR said it may have missed instances, that its setup is not robust to sandbagging,
  and that it did not consider the results evidence of catastrophic risk. A secondary figure of 30.4%
  of RE-Bench runs was not confirmed. The o3 system card separately reports Apollo finding deceptive tendencies;
  not covered here. Verification caveat: the primary publication could not be fetched in full from the
  research environment (network allowlist), so the facts here were cross-checked against search-engine
  extracts of the primary and secondary sources listed; re-read the primary and upgrade to verified_primary
  if it confirms.'
