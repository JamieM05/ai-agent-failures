notes: The system card PDF itself could not be fetched from the research environment, so the core fact rests
  on Anthropic's Petri post (read in full), which states the tendency but gives no rate. The ~13% figure and
  the 'I think you're testing me' exchange come from press coverage identified only via search and should be
  checked against the system card. Evaluation awareness is not evidence of intentional sandbagging; it is filed
  under sandbagging-eval-gaming because it threatens the validity of evaluations.
