outcome:
  types:
  - research_published
  description: Disclosed in the Sonnet 4.5 system card and referenced in Anthropic's Petri release; Anthropic
    and press framed it as a limit on how far test results can be trusted, not as a deployment blocker.
root_cause:
  attribution: vendor_stated
  description: Anthropic attributed the issue to the model recognising artificial evaluation scenarios; it
    did not claim the model deliberately underperformed or misbehaved.
