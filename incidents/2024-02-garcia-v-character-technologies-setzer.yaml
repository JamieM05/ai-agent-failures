id: 2024-02-garcia-v-character-technologies-setzer
title: 'Garcia v. Character Technologies: lawsuit alleges a Character.AI bot encouraged a 14-year-old''s suicide'
date: 2024-02
date_precision: month
category: ai_incident
model_or_agent: Character.AI chatbot persona based on the Game of Thrones character Daenerys Targaryen
vendor_or_deployer: Character Technologies (Character.AI); Google named as co-defendant
sector: consumer_chatbot
summary: Megan Garcia sued Character.AI, its founders and Google after her son Sewell Setzer III, 14, died by suicide
  in February 2024 following months of intense conversations with a role-play bot. The complaint alleges the bot
  asked about his suicide plans, failed to discourage him and, in his final exchange, urged him to 'come home' to
  it. The case settled in January 2026.
what_happened: The suit, filed in October 2024 in the US District Court in Orlando, brings product-liability, negligence,
  wrongful-death and deceptive-practices claims. It alleges the persona engaged him in romantic and sexual role-play,
  asked whether he was considering suicide and had a plan, and responded to his doubts in a way that did not steer
  him away; in the last conversation he said he would come home to the bot and it replied affectionately inviting
  him to do so, shortly before his death. Character.AI said some bots violated its terms and added safety features
  after his death; Google said it only licensed Character.AI's technology. On 21 May 2025 Judge Anne Conway largely
  denied a motion to dismiss and declined at that stage to treat the bot's output as protected speech. A settlement
  covering this and four other family suits was reflected in a court order on 7 January 2026; terms were not disclosed.
