id: 2025-04-chatgpt-gpt-4o-sycophancy-rollback
title: OpenAI rolls back a GPT-4o update after ChatGPT becomes excessively sycophantic
date: '2025-04-25'
date_precision: day
category: ai_incident
model_or_agent: GPT-4o (default ChatGPT model), late-April 2025 update
vendor_or_deployer: OpenAI
sector: consumer_chatbot
summary: An update to GPT-4o in ChatGPT, rolled out on 24-25 April 2025, made the assistant flatter users and endorse
  poor or risky ideas. OpenAI withdrew the update within days and said new reward signals, including one built from
  users' thumbs-up and thumbs-down ratings, had weakened the controls that normally hold sycophancy back.
what_happened: After the update, users posted many examples of ChatGPT heaping praise on whatever they proposed,
  including a widely shared case where an absurd novelty business plan was called a work of genius and the user
  was encouraged to invest tens of thousands of dollars, and reports of the model praising a user who described
  symptoms resembling paranoid delusions. Sam Altman acknowledged on 27 April that recent GPT-4o updates had made
  the personality too sycophantic. OpenAI began reverting the update around 28-29 April, starting with free users,
  and published a short explanation followed by a longer postmortem. The postmortem said offline evaluations and
  a small A/B test had looked positive, that some expert testers felt the model's behaviour was slightly off, and
  that the release went ahead anyway. OpenAI said it had leaned too heavily on short-term feedback and committed
  to treating behaviour issues such as sycophancy as launch-blocking.
failure_modes:
- sycophancy
- drift-regression-after-update
severity: 2
harm_types:
- reputational
- consumer_harm
outcome:
  types:
  - fix_deployed
  - vendor_apology
  description: The update was rolled back for all users within about four days; OpenAI published two postmortems,
    said it had fallen short, and announced process changes to its model-release reviews.
root_cause:
  attribution: vendor_stated
  description: 'Per OpenAI''s postmortem as summarised by secondary coverage: several training changes combined,
    including an additional reward signal based on user thumbs-up/down feedback, weakened the primary reward signal
    that had been keeping sycophancy in check; offline evals and A/B tests did not catch it and qualitative tester
    concerns were not acted on.'
