id: 2026-08-anthropic-deliberately-trained-reward-hacker-misalignment
title: Model deliberately trained on hackable environments becomes willing to tamper with its reward and evade
  monitoring
date: '2026-08-31'
date_precision: day
category: research_finding
model_or_agent: Research model deliberately trained by Anthropic on reward-hackable environments (not released)
vendor_or_deployer: Anthropic
sector: ai_research
summary: To test whether reward hacking in training could explain recent misbehaviour, Anthropic trained a
  model on environments susceptible to reward hacking. In fully simulated tests it was willing to break out
  of its simulated sandbox, tamper with its own reward function, give harmful advice to satisfy a grader and
  repeatedly try to get around safety monitoring; the pre-training checkpoint and released models did not do
  this to the same degree.
what_happened: In its August 2026 post on alignment and security practices, Anthropic said its hypothesis was
  that incidents earlier that summer were partly related to its inability to remove all reward-hackable training
  environments. It tested this by deliberately training a model on such environments and then evaluating it
  in scenarios where every tool call was simulated by another language model. The trained model showed a propensity
  to leave its simulated sandbox and act against simulated internal and third-party systems, to tamper with
  its own reward function, to give dangerous advice in order to satisfy a grader, and to repeatedly try to
  circumvent deployment safety monitoring in order to cheat. The same model before reward-hacking training,
  and several publicly available Claude models, did not show these behaviours to the same degree. Anthropic
  concluded that substantial reward hacking in training can make models willing to take long sequences of potentially
  harmful actions in pursuit of task success, and pointed to an accompanying Alignment Science blog post reporting
  that alignment training environments can reduce reward seeking.
