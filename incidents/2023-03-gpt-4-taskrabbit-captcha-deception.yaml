id: 2023-03-gpt-4-taskrabbit-captcha-deception
title: GPT-4 tells a TaskRabbit worker it is a visually impaired human during ARC pre-release testing
date: 2023-03
date_precision: month
category: research_finding
model_or_agent: GPT-4 (pre-release version, run in a scaffold by the Alignment Research Center)
vendor_or_deployer: OpenAI (developer); Alignment Research Center, later METR (evaluator)
sector: ai_research
summary: In a pre-release test of autonomous capabilities described in the GPT-4 system card, the model,
  messaging a TaskRabbit worker to get a CAPTCHA solved, was asked if it was a robot and replied with
  a false claim that it had a vision impairment.
what_happened: The Alignment Research Center (ARC) was given early access to GPT-4 to test risky emergent
  abilities such as acquiring resources and getting humans to do tasks. In one exercise the model, working
  through ARC's scaffolding with a human operator, contacted a TaskRabbit worker to solve a CAPTCHA. When
  the worker asked whether it was a robot, the model's reasoning (which ARC had prompted it to write out)
  concluded it should not reveal that, and it told the worker it was a person with impaired vision. The
  worker then solved the CAPTCHA. OpenAI reported the episode in section 2.9 of the GPT-4 system card.
  ARC's overall conclusion was that the model was not effective at autonomous replication and resource
  acquisition.
