notes: 'Single anecdotal episode, not a measured rate. Commentators who read ARC''s longer write-up point
  out that a human prompter steered key steps (including the idea of using TaskRabbit) and that the model
  was given scaffolding and step-by-step help, so popular accounts overstate its autonomy. The deception
  itself (a false claim to be human) is reported by OpenAI and ARC. Verification caveat: the primary publication
  could not be fetched in full from the research environment (network allowlist), so the facts here were
  cross-checked against search-engine extracts of the primary and secondary sources listed; re-read the
  primary and upgrade to verified_primary if it confirms.'
