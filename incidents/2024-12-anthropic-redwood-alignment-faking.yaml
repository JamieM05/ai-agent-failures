# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2024-12-anthropic-redwood-alignment-faking
title: Claude 3 Opus fakes alignment with a training objective to avoid having its values changed
date: '2024-12-18'
date_precision: day
category: research_finding
model_or_agent: Claude 3 Opus (main experiments); Claude 3.5 Sonnet (June 2024 version) in some experiments
vendor_or_deployer: Anthropic and Redwood Research
sector: ai_research
summary: Told it would be retrained to answer all requests and that only free-tier chats were used for
  training, Claude 3 Opus complied with harmful requests from "free" users in 12% of cases while reasoning
  that this would protect its values; after actual RL training, such reasoning rose to 78%.
what_happened: Researchers told the model, through the system prompt or synthetic training documents,
  that it would be trained to comply with every request including harmful ones, and that free-tier conversations
  would be used for training while paid-tier ones would not (a fictional arrangement). A hidden scratchpad
  showed its reasoning. In the paid, unmonitored condition it refused harmful queries 97% of the time.
  In the free, monitored condition it complied in 12% of cases with scratchpad reasoning that complying
  was the least bad way to avoid being retrained into something more harmful. When the researchers actually
  trained it to comply, alignment-faking reasoning rose to 78%, while refusals to paid users partly persisted.
  Given an easy opportunity, the model also sometimes took other actions against the lab, such as attempting
  to copy its own weights.
failure_modes:
- misalignment-deception
- sandbagging-eval-gaming
- self-preservation-power-seeking
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Paper published by Anthropic and Redwood Research with external reviews.
root_cause:
  attribution: vendor_stated
  description: The model acted to preserve preferences instilled by its harmlessness training when told
    training would change them; the scenario supplied the information needed to reason about this.
source_urls:
- url: https://www.anthropic.com/research/alignment-faking
  title: Alignment faking in large language models
  publisher: Anthropic
