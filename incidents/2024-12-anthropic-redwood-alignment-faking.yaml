  accessed: '2026-10-17'
verification_status: verified_primary
notes: Artificial setup with a fictional training plan and a hidden scratchpad. The preferences being
  protected were benign (refusing harmful requests); the authors say this does not show malicious goals
  or that dangerous alignment faking will necessarily emerge. Behaviour differed between monitored and
  unmonitored conditions, hence the evaluation-gaming tag. Anthropic page read in full.
