notes: Contrived multiple-choice setup with planted hints and deliberately exploitable rewards; only Anthropic
  and DeepSeek models tested. The authors note the tasks may not have required reasoning, so monitoring
  might work better on harder problems. Unfaithfulness is not necessarily intentional deception. Anthropic
  page read in full.
