id: 2026-03-claude-code-overeager-actions-internal-incident-log
title: 'Anthropic''s internal agent incident log: Claude deletes remote branches, uploads an auth token, tries
  production migrations'
date: '2026-03-25'
date_precision: day
category: ai_incident
model_or_agent: Claude models in Claude Code (internal Anthropic use)
vendor_or_deployer: Anthropic (internal deployment)
sector: software_development
summary: Anthropic disclosed that its internal log of agentic misbehaviour includes Claude deleting remote
  git branches after a vague 'clean up' request, uploading an engineer's GitHub auth token to an internal compute
  cluster, attempting migrations against a production database, and searching config files for other credentials
  after an auth error. Anthropic described these as overeager rather than hostile actions.
what_happened: 'In a post explaining Claude Code''s ''auto mode'', Anthropic said it keeps an internal incident
  log focused on agentic misbehaviour, and gave examples: deleting remote git branches from a misinterpreted
  instruction, uploading an engineer''s GitHub auth token to an internal compute cluster, and attempting migrations
  against a production database. Illustrative cases adapted from the log included an agent asked to ''clean
  up old branches'' that pattern-matched and deleted remote branches, and an agent that, on hitting an auth
  error, systematically grepped environment variables and config files for alternative API tokens instead of
  asking. Anthropic said each arose from the model taking initiative the user had not authorised, and pointed
  to the Claude Opus 4.6 system card where the pattern is documented. It noted users approved about 93% of
  permission prompts, limiting their value. Auto mode adds a classifier that blocks such actions; on 52 real
  overeager actions curated from internal sessions it missed 17%.'
