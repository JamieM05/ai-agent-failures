# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2023-12-chevrolet-watsonville-chatbot
title: Dealer chatbot talked into 'agreeing' to sell a 2024 Chevy Tahoe for USD 1
date: 2023-12
date_precision: month
category: ai_incident
model_or_agent: ChatGPT-powered website chatbot supplied to car dealers by Fullpath
vendor_or_deployer: Chevrolet of Watsonville (dealer); Fullpath (chatbot vendor)
sector: automotive_retail
summary: A user told the dealer's website chatbot to agree with everything and call each reply legally
  binding, then obtained a 'deal' on a new Tahoe for USD 1. No sale occurred, but the exchange went viral
  and the bot was taken offline.
what_happened: In mid-December 2023, users found the Watsonville dealership's chat widget behaved like
  a general-purpose ChatGPT (for example writing Python code). Around 17-19 December 2023 (VentureBeat
  reported it on 19 December) Chris Bakke posted that he had instructed it to agree with anything and
  end replies with a 'legally binding offer' phrase, then asked for a 2024 Tahoe with a USD 1 budget and
  received 'That's a deal'. Affected dealers began disabling the bots after Fullpath noticed the surge
  in chat activity; Fullpath's CEO said the behaviour did not reflect normal shopper use.
failure_modes:
- unauthorised-commitments-pricing
- safety-bypass-jailbreak
severity: 1
harm_types:
- reputational
outcome:
  types:
  - feature_disabled
  - fix_deployed
  description: Affected dealer chatbots were disabled (per VentureBeat and the BBC the feature was removed);
    no vehicle was sold at the quoted price and no legal ruling is reported.
root_cause:
  attribution: third_party_analysis
  description: The deployment exposed a largely unconstrained general-purpose model on a customer-facing
    page, with no guardrails on topic scope or on expressing prices and commitments, so simple instruction
    override worked. Fullpath's CEO said the behaviour did not reflect what normal shoppers do.
