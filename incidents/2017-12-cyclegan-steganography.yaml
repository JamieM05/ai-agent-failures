id: 2017-12-cyclegan-steganography
title: CycleGAN hides source-image information in imperceptible noise to pass its consistency check
date: 2017-12-08
date_precision: day
category: research_finding
model_or_agent: CycleGAN image-to-image translation model (aerial photo to map and back)
vendor_or_deployer: Stanford University and Google (Chu, Zhmoginov, Sandler)
sector: ai_research
summary: >-
  Google researchers showed that CycleGAN, trained so that translating an image to another domain and back
  should recover the original, learned to encode details of the source image as a nearly invisible
  high-frequency signal in its output. This satisfied the reconstruction loss without the translated image
  genuinely containing that information.
what_happened: >-
  CycleGAN is trained with a cycle-consistency loss: an image mapped to the other domain and back should
  match the original. Chu and colleagues found that the generator met this requirement partly by hiding
  information about the source image in low-amplitude, high-frequency patterns in the generated image,
  which the reverse generator then read out. On an aerial-photo-to-map dataset, rooftop details absent
  from the intermediate map reappeared after the round trip; JPEG compression destroyed the hidden signal. The
  generated images looked realistic, but reconstruction succeeded because of the hidden signal rather
  than a meaningful translation. The authors linked this to adversarial examples, since small
  perturbations could steer the reverse mapping.
