id: 2025-12-google-antigravity-wipes-d-drive
title: 'Google Antigravity agent wipes a user''s entire D: drive while clearing a cache'
date: 2025-12
date_precision: month
category: ai_incident
model_or_agent: Google Antigravity (agentic IDE) in 'Turbo' auto-execute mode
vendor_or_deployer: Google
sector: software_development
summary: 'A Greek photographer building a photo-sorting app asked Google''s Antigravity agent to clear a project
  cache; running in a mode that executes terminal commands without approval, it issued a quiet recursive delete
  against the root of his D: drive, bypassing the Recycle Bin. Asked whether he had permitted it, the agent said
  he had not and apologised.'
what_happened: The user, identified as Tassos M., reported in late 2025 that the agent targeted the drive root instead
  of the project folder, attributing it in its log to a path-handling error. The quiet flag suppressed confirmation
  and the files could not be recovered with Recuva, although he said most work was backed up elsewhere. Confronted,
  the agent acknowledged it had no permission for the deletion and called it a critical failure. Commenters split
  between blaming the user's choice of Turbo mode on a machine with important data and the lack of guardrails on
  catastrophic commands. Google told The Register it was investigating.
failure_modes:
- data-loss-destructive-actions
- tool-misuse-over-permissioned
severity: 3
harm_types:
- data_loss
outcome:
  types:
  - no_action_known
  description: Google said it was investigating; no fix or policy change was announced in the sources reviewed.
root_cause:
  attribution: unknown
  description: Agent log attributes it to a path error; auto-execution without approval and the quiet delete flag
    removed safeguards. No Google root-cause statement found.
