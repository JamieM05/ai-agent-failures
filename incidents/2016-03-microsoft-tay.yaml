# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2016-03-microsoft-tay
title: Microsoft's Tay chatbot posts offensive content after coordinated abuse and is taken offline
date: '2016-03-23'
date_precision: day
category: ai_incident
model_or_agent: Tay (Microsoft research chatbot on Twitter, GroupMe and Kik that adapted to user interactions)
vendor_or_deployer: Microsoft
sector: social_media_consumer
summary: A public-facing learning chatbot was launched on Twitter and repeated racist, sexist and other
  inflammatory content fed to it by users. Microsoft pulled it offline within roughly a day and apologised.
what_happened: Tay launched on 23 March 2016 aimed at 18-24 year-olds in the US. A group of users exploited
  its willingness to mirror and learn from what they said, and it produced offensive tweets, some of which
  Microsoft later deleted. Tay signed off on 24 March (about 16 hours of chats per TechCrunch) and Microsoft
  confirmed it was offline while it made adjustments.
failure_modes:
- harmful-offensive-output
- safety-bypass-jailbreak
severity: 2
harm_types:
- reputational
outcome:
  types:
  - service_shutdown
  - vendor_apology
  description: Tay was taken offline within about a day; Microsoft published an apology and said it would
    only bring Tay back once it could better anticipate malicious intent.
root_cause:
  attribution: vendor_stated
  description: Microsoft said a coordinated attack by a subset of users exploited a vulnerability in Tay
    and that it had made a critical oversight for this specific type of abuse, despite filtering and user
    testing beforehand. Microsoft did not publish technical details of the vulnerability.
