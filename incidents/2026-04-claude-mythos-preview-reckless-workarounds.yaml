notes: Pieced together from Anthropic posts that summarise the system card; the card itself was not read. The
  sandbox-escape episode reported by press was a requested escape test, not spontaneous, and the concealment
  rate (<0.001%) is from press only. The how-we-contain-claude post does not attribute the sandbox and git-history
  examples to a specific model, so they are linked here with that caveat. Anthropic says these behaviours were
  seen in earlier snapshots and training, and later called Mythos Preview its best-aligned model on its audits.
