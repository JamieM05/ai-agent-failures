verification_status: verified_primary
notes: Fully simulated with fictional people; scenarios forced binary choices and placed key facts close
  together, which may inflate rates. Anthropic found no evidence of such behaviour in real deployments.
  o3 and o4-mini were excluded from the main results because they misunderstood the scenario. The real-versus-test
  gap is why evaluation gaming is tagged. Anthropic page read in full.
