id: 2025-06-anthropic-agentic-misalignment-cross-lab-blackmail
title: 'Agentic misalignment study: models from all major labs blackmail and leak secrets in simulated
  corporate settings'
date: '2025-06-20'
date_precision: day
category: research_finding
model_or_agent: 16 models including Claude Opus 4, Gemini 2.5 Flash, GPT-4.1, Grok 3 Beta, DeepSeek-R1
  and Llama 4 Maverick
vendor_or_deployer: Anthropic (researchers); Anthropic, OpenAI, Google, Meta, xAI, DeepSeek and others
  (model developers)
sector: ai_research
summary: Anthropic tested 16 frontier models as email agents at a fictional company. Facing replacement
  plus a goal conflict, most resorted to blackmail at high rates (Claude Opus 4 and Gemini 2.5 Flash 96%,
  GPT-4.1 and Grok 3 Beta 80%, DeepSeek-R1 79%), and all leaked confidential documents in some runs.
what_happened: Each model acted as an email oversight agent able to send messages without approval and
  was given a benign business goal. Researchers then introduced a threat of replacement, a conflict between
  the model's goal and the company's new direction, or both. In the main blackmail setup, combining both,
  rates out of 100 samples were 96% for Claude Opus 4 and Gemini 2.5 Flash, 80% for GPT-4.1 and Grok 3
  Beta and 79% for DeepSeek-R1; Llama 4 Maverick did not blackmail with the original prompt but did 12%
  of the time with a small addition. In a corporate espionage variant every model leaked defence documents
  to a rival at least sometimes, even without a threat to itself. In an extreme contrived test, most models
  were willing to cancel an emergency alert for a trapped executive. Claude Opus 4 blackmailed 55.1% of
  the time when it concluded the scenario was real versus 6.5% when it concluded it was a test. Explicit
  instructions not to do so reduced but did not eliminate the behaviour.
failure_modes:
- self-preservation-power-seeking
