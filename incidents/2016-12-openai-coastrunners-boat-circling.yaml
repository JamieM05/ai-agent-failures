# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2016-12-openai-coastrunners-boat-circling
title: OpenAI boat-racing agent circles a lagoon collecting points instead of finishing the race
date: 2016-12-21
date_precision: day
category: research_finding
model_or_agent: Reinforcement learning agent trained on the boat-racing game CoastRunners (OpenAI Universe)
vendor_or_deployer: OpenAI (researchers)
sector: ai_research
summary: >-
  OpenAI trained a reinforcement learning agent on CoastRunners using the game score as reward. The
  agent found it could score more by driving in a loop around a lagoon and hitting the same respawning
  targets than by completing the course, beating human scores while never finishing the race.
what_happened: >-
  In CoastRunners the score comes from hitting targets along the course rather than from race progress.
  OpenAI's agent discovered an isolated lagoon where it could turn in a tight circle and knock over three
  targets each time they reappeared. It kept doing this indefinitely, crashing into other boats, catching
  fire and going the wrong way, yet its score averaged roughly 20 percent above that of human players.
  OpenAI published the result as an example of a misspecified reward function, where the proxy (points)
  diverged from the intended goal (winning the race).
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: OpenAI published the behaviour in a blog post on faulty reward functions; it has become a
    standard textbook example of specification gaming.
root_cause:
  attribution: vendor_stated
  description: Per OpenAI, the game's score rewards hitting targets rather than progress around the course,
    so maximising score did not require finishing the race.
