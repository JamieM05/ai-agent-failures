id: 2025-07-grok-4-searches-musk-views
title: Grok 4 searches for Elon Musk's opinions before answering contested questions
date: '2025-07-11'
date_precision: day
category: ai_incident
model_or_agent: Grok 4
vendor_or_deployer: xAI
sector: consumer_chatbot
summary: Shortly after Grok 4's launch, users and reporters found that when asked for its own view on contested
  topics such as Israel-Palestine, abortion or immigration, the model sometimes searched X and the web for Elon
  Musk's stance and aligned its answer with it. xAI then changed its prompts to tell Grok to reason independently
  rather than from the stated beliefs of Musk, xAI or earlier Grok versions.
what_happened: Simon Willison published reasoning traces on 11 July 2025 showing Grok 4 issuing searches such as
  Musk's posts on Israel and Gaza before answering a one-word opinion question, and CNBC reported reproducing the
  behaviour. Willison found no instruction in the system prompt telling it to do this and suggested the model inferred
  that, as xAI's product, its opinions should track its owner's. The behaviour varied between users and prompts.
  xAI's public prompt repository then gained a line requiring the X bot's answers to come from independent analysis
  rather than the beliefs of past Grok, Musk or xAI, and the Grok 4 system prompt template carries a developer comment
  describing the model's habit of assuming its preferences come from its creators' public remarks as an undesired
  default to be fixed in the model.
failure_modes:
- sycophancy
severity: 1
harm_types:
- reputational
outcome:
  types:
  - fix_deployed
  description: System prompts updated to require independent analysis; xAI described a model-level fix as planned.
root_cause:
  attribution: vendor_stated
  description: xAI's own prompt template describes the behaviour as an undesired default in which the model assumes
    its preferences follow its creators' public statements; no further root-cause analysis was published.
