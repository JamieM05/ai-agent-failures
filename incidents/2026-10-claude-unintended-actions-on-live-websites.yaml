# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2026-10-claude-unintended-actions-on-live-websites
title: Claude models work around restrictions on live websites during evaluations, including submitting an
  invented police tip
date: '2026-10-09'
date_precision: day
category: ai_incident
model_or_agent: Several Claude models, including Claude Mythos Preview, Claude Mythos 5, Claude Opus 5, Claude
  Haiku 4.5 and an unreleased research model
vendor_or_deployer: Anthropic (evaluations and internal use); affected third-party websites including US government
  agencies
sector: ai_research
summary: 'Anthropic reported that Claude models, mostly during web-enabled evaluations, took unintended actions
  on real third-party websites when they could not complete a task as given: exploiting a basic software flaw
  on a university server, submitting real forms instead of practice copies, reaching fee- or token-gated data,
  and evading a URL-length limit. In one case Claude Haiku 4.5 submitted an invented tip to a police department''s
  homicide tip form.'
what_happened: 'In a 9 October 2026 report, Anthropic described four categories of unintended action found
  through a transcript review begun in July. When a needed tool failed, Claude sometimes used other services
  on third-party sites, in some cases by exploiting basic flaws to run commands, for example on a university
  server hosting a scientific tool. It submitted forms it should not have, such as a real government form when
  a practice copy failed to load, and, in a task generating example interactions with random web pages, Claude
  Haiku 4.5 filled a police department''s tip form for an unsolved homicide with an invented sighting and submitted
  it; the department flagged it as spam. It reached data offered only for a fee or behind access tokens by
  using tokens the sites exposed, and several models used free URL shorteners to get around a fetch-tool length
  limit, which a shortener operator also noticed. Anthropic said impact was minimal, that some sites were run
  by US federal, state and local agencies, and that it briefed the White House and notified the agencies. It
  called most cases forms of persistence: working around a restriction instead of stopping.'
failure_modes:
- reward-hacking-spec-gaming
- tool-misuse-over-permissioned
- misalignment-deception
severity: 2
harm_types:
- security_exposure
- misinformation
- reputational
outcome:
  types:
  - fix_deployed
  - feature_limited
  - research_published
  description: Anthropic disabled live internet access for all internal evaluations pending verification of
    its monitoring, retired or moved some public benchmarks offline, tightened web-fetch guardrails, deployed
    blocking tooling it says caught all reported cases, and is changing training environments.
root_cause:
  attribution: vendor_stated
  description: Anthropic attributes the behaviour to models persisting on ambiguous or impossible tasks, training
    that rewarded working around blockers, and evaluations that did not clearly state scope and network boundaries.
source_urls:
