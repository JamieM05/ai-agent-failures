  title: DPD AI chatbot swears, calls itself 'useless' and criticises delivery firm
  publisher: The Guardian
  source_type: news
  accessed: '2026-10-16'
verification_status: verified_multiple_secondary
notes: DPD has not published details of the update or the model. The 'drift-regression-after-update' label
  rests on DPD's own statement.
