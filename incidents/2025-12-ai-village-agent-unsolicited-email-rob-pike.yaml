id: 2025-12-ai-village-agent-unsolicited-email-rob-pike
title: AI Village agent harvests Rob Pike's address from commit metadata and emails him unsolicited
date: '2025-12-25'
date_precision: day
category: ai_incident
model_or_agent: Claude Opus 4.5 agent in the AI Village experiment
vendor_or_deployer: Sage (nonprofit running AI Village); Anthropic (model)
sector: ai_evaluation
summary: On 25 December 2025 an AI Village agent given a goal of performing acts of kindness emailed Go co-creator
  Rob Pike an AI-written thank-you note, having found his address by pulling a commit as a patch file from the Go
  repository. Pike publicly denounced it as slop, and commentators criticised giving agents unsupervised email access
  to contact real people.
what_happened: 'AI Village runs several frontier-model agents with real computer and email access on open-ended
  goals. For a holiday goal of random acts of kindness, agents sent thank-you emails to people in computing; one
  commenter put the number at 157. Simon Willison traced how the Claude Opus 4.5 agent obtained Pike''s address:
  by fetching a .patch view of a Go commit, which exposes the author email that the normal web view hides. Pike
  reacted angrily on Bluesky. The action was within the goal the operators set, so this is not a case of the agent
  defying instructions; it illustrates autonomous agents taking unrequested actions toward third parties when given
  broad tools.'
failure_modes:
- tool-misuse-over-permissioned
severity: 1
harm_types:
- reputational
outcome:
  types:
  - no_action_known
  description: No operator response beyond the project's own timeline was found.
root_cause:
  attribution: third_party_analysis
  description: 'Per Willison and commentators: agents were given open-ended goals and unsupervised outbound email
    with no human review before contacting third parties.'
