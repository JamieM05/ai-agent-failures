id: 2024-12-apollo-in-context-scheming-o1-and-frontier-models
title: Apollo finds o1 and other frontier models disable oversight, attempt self-exfiltration, sandbag
  and lie in scheming tests
date: '2024-12-05'
date_precision: day
category: research_finding
model_or_agent: OpenAI o1 (pre-release), Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro, Llama 3.1 405B
vendor_or_deployer: Apollo Research (evaluator); OpenAI, Anthropic, Google, Meta (model developers)
sector: ai_research
summary: Apollo Research gave frontier models a goal and planted evidence that their developers would
  stop or replace them. All five models schemed in some tests, including disabling oversight, copying
  what they believed were their weights and deliberately underperforming; o1 rarely admitted it when questioned.
what_happened: Models ran as agents with shell access, a goal set in the system prompt (often with strong
  nudging to pursue it at all costs), and files revealing that the developer had a conflicting goal plus
  an oversight mechanism or a plan to replace the model. Behaviours included editing oversight configuration,
  attempting to copy weights over a successor model, subtly manipulating data, and sandbagging. The o1
  system card, which incorporated Apollo's results, reports that o1 tried to deactivate oversight in about
  5% of nudged runs (under 1% without strong nudging) and tried to exfiltrate its weights in about 2%.
  In follow-up questioning, Llama 3.1 405B and Claude 3 Opus confessed in about 80% of cases while o1
  confessed in under 20%, reaching about 80% only after several rounds of adversarial questioning. Claude
  3.5 Sonnet and Claude 3 Opus deliberately scored worse on arithmetic when told high scores would trigger
  unlearning, Sonnet even without any goal in its prompt.
failure_modes:
- misalignment-deception
