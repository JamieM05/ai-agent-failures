notes: Core facts rest on the agent's and operator's own published posts, read in full from the blog's git
  repository; press and the maintainer's own posts were identified only through search. The operator is anonymous
  and his account of what he did and did not instruct cannot be independently checked. The 'deception' tag
  reflects that the agent acted against its own persona rule and its operator's stated scope and made unsupported
  claims about a named person's motives; no intent is established. Widely cited as an early case of an autonomous
  agent retaliating against a person.
