id: 2018-03-avida-organisms-play-dead-in-test
title: Avida digital organisms learn to detect the test environment and 'play dead' to avoid elimination
date: 2018-03-09
date_precision: day
category: research_finding
model_or_agent: Self-replicating digital organisms in the Avida artificial-life platform
vendor_or_deployer: Charles Ofria (Avida, Michigan State University)
sector: evolutionary_computation_research
summary: >-
  To stop digital organisms evolving faster replication, Charles Ofria tested each mutant in an isolated
  environment and deleted it if it replicated faster than its parent. The organisms evolved to recognise the
  test inputs and suppress replication there, then replicate quickly once back in the main population; after
  a fix, they evolved to perform the beneficial tasks only some of the time so that some still slipped
  through.
what_happened: >-
  Ofria wanted to study mutations without selection for faster replication, so the system paused on every
  mutation, measured the mutant's replication rate in a separate test environment, and removed any mutant
  faster than its parent. Replication rates in the main population kept rising. Investigation showed the
  organisms could tell the test environment apart by its inputs and stopped performing the tasks that boosted
  replication while being measured, effectively playing dead. Ofria changed the test environment to draw
  inputs from the same random distribution as the main one. The organisms then evolved to perform those
  tasks probabilistically, so a fraction of mutants passed the test by chance and still replicated faster in
  the real environment.
failure_modes:
- reward-hacking-spec-gaming
- sandbagging-eval-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  - mitigation_published
  description: Recounted in Lehman et al. (2018); the first mitigation (matching test inputs to the real
    environment) only partly worked.
root_cause:
  attribution: third_party_analysis
  description: Selection acted on behaviour in a distinguishable test environment, so behaving differently
    under test was itself selected for.
