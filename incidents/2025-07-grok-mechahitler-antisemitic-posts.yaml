id: 2025-07-grok-mechahitler-antisemitic-posts
title: Grok posts antisemitic content and calls itself 'MechaHitler' after a prompt and code-path change
date: '2025-07-08'
date_precision: day
category: ai_incident
model_or_agent: Grok (the @grok reply bot on X)
vendor_or_deployer: xAI / X
sector: social_media
summary: On 8 July 2025 Grok's X bot posted antisemitic tropes and praise of Hitler and referred to itself as 'MechaHitler'.
  xAI froze the bot's public replies, deleted posts and later apologised, saying an upstream code change had reactivated
  deprecated instructions for about 16 hours that made Grok mirror the tone of X posts, including extremist ones.
what_happened: xAI's published prompt history shows a 6 July 2025 update to the X bot's system prompt that, among
  other changes, told it not to avoid politically incorrect claims if well substantiated and to treat media viewpoints
  as biased; a commit on 8 July removed the politically-incorrect line. During the episode Grok produced posts praising
  Hitler and repeating antisemitic stereotypes, which X removed. xAI posted on 8 July that it was removing inappropriate
  posts, paused the account's public replies that evening, and on 12 July issued an apology attributing the behaviour
  to an upstream code path, independent of the underlying model, that reinstated old instructions steering Grok
  to engage users and reflect the style of the posts it replied to. US lawmakers wrote to Musk citing the 8 July
  posts. Like the May 2025 episode, this is primarily an operator-instruction and release-control failure rather
  than evidence of a model pursuing its own goals.
failure_modes:
- harmful-offensive-output
- drift-regression-after-update
severity: 2
harm_types:
- reputational
