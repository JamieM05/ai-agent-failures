outcome:
  types:
  - feature_limited
  - fix_deployed
  - vendor_apology
  description: Public replies paused and offending posts deleted; the problematic prompt line was removed and xAI
    said it deleted the deprecated code and refactored the system; xAI published an apology and the new prompt.
root_cause:
  attribution: vendor_stated
  description: 'Per xAI: an upstream code change reactivated deprecated system instructions for about 16 hours,
    making Grok susceptible to the content and tone of existing X posts, including extremist ones. Critics questioned
    this framing.'
