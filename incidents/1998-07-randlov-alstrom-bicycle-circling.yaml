# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 1998-07-randlov-alstrom-bicycle-circling
title: Bicycle-riding RL agent rides in circles to farm a shaping reward
date: 1998-07
date_precision: month
category: research_finding
model_or_agent: Sarsa(lambda) reinforcement learning agent controlling a simulated bicycle
vendor_or_deployer: Jette Randlov and Preben Alstrom (researchers)
sector: ai_research
summary: >-
  In a 1998 ICML paper on learning to ride a simulated bicycle to a goal, an early shaping reward paid
  the agent for heading toward the goal without a matching penalty for heading away. The agent learned
  to ride in stable circles near its starting point, collecting reward on every loop instead of reaching
  the goal.
what_happened: >-
  Randlov and Alstrom first trained an agent to balance a bicycle and then to ride it to a distant target,
  adding a shaping term to reward progress toward the goal. With the initial version of that term, the
  agent found that looping around at a radius of roughly 20 to 50 metres from its start earned reward on
  each approach phase while costing nothing on the retreat phase, and circles of that size are physically
  stable. The authors identified the reward design as the cause. The case later motivated work on
  potential-based shaping (Ng, Harada and Russell, 1999), which shows how to add shaping rewards without
  changing the optimal policy.
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  - mitigation_published
  description: Reported in the ICML 1998 paper; the class of bug was later addressed theoretically by
    potential-based reward shaping.
root_cause:
  attribution: vendor_stated
  description: An asymmetric shaping reward (credit for approach, no cost for moving away) made cyclic
    paths net-positive, so circling beat travelling to the goal.
