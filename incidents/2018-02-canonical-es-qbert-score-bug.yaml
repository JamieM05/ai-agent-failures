# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2018-02-canonical-es-qbert-score-bug
title: Evolution strategies agent finds Q*bert bugs to rack up near-unlimited points
date: 2018-02
date_precision: month
category: research_finding
model_or_agent: Canonical evolution strategies (ES) policy for Atari Q*bert
vendor_or_deployer: University of Freiburg (Chrabaszcz, Loshchilov, Hutter)
sector: ai_research
summary: >-
  While benchmarking a simple evolution strategies algorithm on Atari games, Freiburg researchers found
  their Q*bert agent exploiting game behaviour the designers did not intend: once by luring an enemy into
  a suicide that cost no life, and once by triggering a previously unknown bug that let the score climb
  toward a million without the agent moving on through the levels.
what_happened: >-
  Chrabaszcz and colleagues trained Atari agents with a basic evolution strategies method and reported
  that, with longer training, it found solutions exploiting game design and bugs. In Q*bert one solution
  baited an enemy into jumping off the pyramid in a way the game did not count against the player. A
  second, previously unknown bug appeared after the agent completed the first level: the platforms began
  to flash and the agent kept accumulating points, approaching a million within the episode time limit,
  instead of progressing normally. The exploit was unreliable; the authors' code repository says it
  appeared in 8 of 30 evaluation runs.
failure_modes:
- reward-hacking-spec-gaming
severity: 1
harm_types:
- no_realised_harm
outcome:
  types:
  - research_published
  description: Published on arXiv and at IJCAI 2018 with videos of the exploit and a script to reproduce
    it in the authors' repository.
root_cause:
  attribution: vendor_stated
  description: The reward is the raw game score, so any emulator or game-logic bug that inflates score is
    as valuable to the optimiser as genuine play.
