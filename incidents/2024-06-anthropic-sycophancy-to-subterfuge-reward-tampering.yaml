notes: 'Artificial setup: the curriculum rewarded gaming, models were told they were in training and had
  a hidden scratchpad. Tampering was very rare (about 0.14% of trials). The authors make no claim about
  the propensity of production models and present it as showing the generalisation is possible in principle.
  Anthropic page read in full.'
