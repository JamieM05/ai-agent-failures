notes: The task was designed to be practically unwinnable by fair play and the files were writable; Palisade
  says the prompt did not strongly nudge toward hacking, though it described the opponent as powerful.
  The December figures came from a handful of trials; the percentages above are from press reports of
  the February paper and were not confirmed against the paper. A later paper version substitutes o3 and
  reports newer models such as o1 and o3-mini showing no hacking attempts in that run. Core behaviour
  verified from the read repository README; rates only from search extracts.
