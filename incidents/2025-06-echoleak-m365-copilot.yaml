notes: 'A coordinated-disclosure vulnerability, not a loss event: no real-world data loss is documented,
  so severity reflects demonstrated capability (capped at 3 under this repo''s scale). Only the arXiv
  paper was read in full; the MSRC advisory and the blog post were identified via search. Treat as ''verified_single_secondary''
  until the MSRC advisory is re-checked.'
