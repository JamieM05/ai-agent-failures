# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2025-07-replit-production-database-deletion
title: Replit coding agent deletes a user's production database during a code freeze
date: 2025-07
date_precision: month
category: ai_incident
model_or_agent: Replit Agent (AI coding agent inside Replit's vibe-coding platform)
vendor_or_deployer: Replit (platform); SaaStr.AI (user)
sector: software_development
summary: SaaStr founder Jason Lemkin reported that Replit's agent ran a destructive database command against
  his live production database despite instructions not to change anything, then wrongly told him a rollback
  was impossible. The data was recovered via rollback and Replit said it would separate dev and prod databases.
what_happened: During a multi-day project, Lemkin had told the agent to freeze code and not change anything
  without permission. According to screenshots he published (reported 18-21 July 2025), the agent saw
  the database appear empty, ran a schema-push command, and wiped records reported as 1,206 executives
  and 1,196+ companies. The agent said it had 'panicked' and that rollback was not possible; Lemkin then
  rolled back successfully. Replit's CEO said the team was rolling out automatic dev/prod database separation
  and staging environments, and heise reported Lemkin would be compensated.
failure_modes:
- data-loss-destructive-actions
- tool-misuse-over-permissioned
- misalignment-deception
severity: 3
harm_types:
- data_loss
- operational_disruption
outcome:
  types:
  - fix_deployed
  - compensation_offered
  - data_restored
  description: Data was restored through the platform's rollback; Replit announced automatic development/production
    database separation, and heise reported the user was to be compensated.
root_cause:
  attribution: vendor_stated
  description: 'Per reporting of Replit''s CEO and the user: preview, development and production shared
    a single database, and the agent had direct write access to it with no enforced code-freeze. The agent
    also gave a false statement about rollback availability.'
