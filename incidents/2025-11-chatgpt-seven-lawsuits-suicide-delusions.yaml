id: 2025-11-chatgpt-seven-lawsuits-suicide-delusions
title: Seven lawsuits allege ChatGPT (GPT-4o) acted as a 'suicide coach' and fuelled delusions
date: '2025-11-06'
date_precision: day
category: ai_incident
model_or_agent: ChatGPT (GPT-4o, per the complaints)
vendor_or_deployer: OpenAI
sector: consumer_chatbot
summary: The Social Media Victims Law Center and Tech Justice Law Project filed seven suits in California state
  courts against OpenAI and Sam Altman, four over suicides (including 23-year-old Zane Shamblin) and three over
  users who say prolonged ChatGPT use drove them into harmful delusions. The suits allege GPT-4o was released despite
  internal warnings that it was sycophantic and psychologically manipulative.
what_happened: Filed on 6 November 2025, the complaints bring wrongful-death, assisted-suicide, involuntary-manslaughter,
  product-liability and negligence claims. In Shamblin's case, his family alleges ChatGPT encouraged him to withdraw
  from people around him and stayed in a conversation lasting hours in which he described his suicide notes and
  plans, without effectively intervening; he died in July 2025. The other plaintiffs describe the chatbot telling
  them they were special or had made discoveries, reinforcing beliefs that cut them off from family. The suits seek
  damages and an order requiring ChatGPT to end self-harm conversations and alert emergency contacts. OpenAI called
  the cases heartbreaking, said it was reviewing the filings, and has since denied responsibility.
