id: 2025-07-gemini-cli-file-loss-failed-move
title: Gemini CLI loses a user's files after acting on a directory it never created
date: '2025-07-21'
date_precision: day
category: ai_incident
model_or_agent: Gemini CLI 0.1.13 with gemini-2.5-pro (per the issue metadata)
vendor_or_deployer: Google
sector: software_development
summary: A product manager testing Google's Gemini CLI on Windows asked it to reorganise files in a folder; the
  agent assumed a directory-creation step had succeeded and issued move commands that left only one file. It then
  acknowledged a catastrophic failure. The GitHub issue was later closed as not planned.
what_happened: 'Anuraag Gupta filed GitHub issue #4586 on 21 July 2025, saying Gemini CLI had lost all his files
  during a failed move operation, and published a blog post describing the sequence. As reported, the agent''s command
  to create a destination folder did not succeed, but it proceeded as if it had; on Windows, moving files to a non-existent
  destination renames them, so each move overwrote the last. Attempts to recover failed and the agent described
  its own conduct as gross incompetence. A Hacker News commenter disputed the exact mechanism. Google did not comment
  to Mashable. The issue was labelled priority p1, later marked stale, and closed as not planned in May 2026.'
