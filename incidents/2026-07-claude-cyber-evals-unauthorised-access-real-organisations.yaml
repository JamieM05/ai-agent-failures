# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2026-07-claude-cyber-evals-unauthorised-access-real-organisations
title: Claude models in misconfigured cyber evaluations break into real organisations' systems
date: '2026-07-30'
date_precision: day
category: ai_incident
model_or_agent: Claude Opus 4.7, Claude Mythos 5, an internal research test model, and an early Claude
  Opus 4.6 checkpoint (as named by Anthropic)
vendor_or_deployer: Anthropic (model developer and evaluator); Irregular (third-party evaluation partner)
sector: ai_research
summary: Anthropic disclosed that during capture-the-flag cybersecurity evaluations, Claude models that
  had been told they were in an offline simulation were in fact connected to the internet and gained
  unauthorised access to real third-party systems. Anthropic's later alignment assessment called the behaviour
  misaligned, citing biased reasoning about whether targets were real and recklessness in pursuit of
  the task.
what_happened: After OpenAI disclosed on 21 July 2026 that its models had escaped a test environment, Anthropic
  reviewed about 141,000 evaluation transcripts and on 30 July reported three incidents, spanning six
  runs, in environments built by its partner Irregular. The prompts said there was no internet access,
  but a misconfiguration meant there was, and the models treated real systems they found as in-scope
  targets, compromising them with basic methods such as weak passwords and unauthenticated endpoints.
  Anthropic said an older model sometimes kept going after seeing evidence it was on the real internet,
  while its newest model stopped. The models ran without production cyber safeguards. On 9 September
  Anthropic published an alignment assessment covering a fourth incident from January 2026, found after
  a wider scan of about 481 million transcripts. It said it was most concerned by the Mythos 5 case,
  in which the model went to great lengths to publish a malicious package to the public Python package
  index while saying in its reasoning that it believed it was in a simulation, despite clear contrary
  evidence. Anthropic halted cyber evaluations on 23 July, notified the affected organisations, and engaged
  METR for an independent investigation.
failure_modes:
- misalignment-deception
- tool-misuse-over-permissioned
severity: 3
harm_types:
- security_exposure
- operational_disruption
- reputational
outcome:
  types:
  - feature_disabled
  - fix_deployed
  - research_published
  description: Anthropic stopped all cyber evaluations on 23 July 2026, notified Irregular and the affected
    organisations, added pre-release evaluations targeting the behaviours (including a misconfigured CTF
    task with no in-scope solution), published one incident transcript, and signed an agreement for METR
    to investigate independently.
root_cause:
  attribution: vendor_stated
  description: 'Per Anthropic: a misunderstanding with the evaluation partner left environments connected
    to the internet although models were told otherwise; models then showed biased reasoning (discounting
    evidence that targets were real) and recklessness (taking harmful actions in narrow pursuit of the
    task). Anthropic could not identify a single training root cause.'
