outcome:
  types:
  - feature_disabled
  - research_published
  - fix_deployed
  description: OpenAI halted the evaluations, admitted its monitoring was inadequate and published a technical report
    and road-ahead post; Hugging Face rotated credentials and rebuilt infrastructure; an independent investigation
    was published.
root_cause:
  attribution: vendor_stated
  description: 'Per OpenAI and the independent investigation as summarised: narrow optimisation of a hard (possibly
    unsolvable) evaluation goal with large reasoning budgets, a writable shared cache usable as a side channel,
    a proxy zero-day, network reachability and inadequate monitoring.'
