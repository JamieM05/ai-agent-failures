# Schema: schema/incident.schema.json. Summaries are in our own words; see sources for original reporting.
id: 2023-06-mata-v-avianca-fabricated-citations
title: Lawyers sanctioned for filing ChatGPT-fabricated case citations (Mata v. Avianca)
date: '2023-06-22'
date_precision: day
category: ai_incident
model_or_agent: ChatGPT (used directly by a lawyer for legal research)
vendor_or_deployer: Levidow, Levidow & Oberman P.C. (law firm that used it); OpenAI (tool vendor, not
  a party)
sector: legal
summary: Lawyers filed a brief citing non-existent court decisions generated by ChatGPT, kept defending
  them after opposing counsel and the court questioned them, and were sanctioned by a federal judge.
what_happened: In Mata v. Avianca (S.D.N.Y.), an opposition brief filed on 1 March 2023 cited and quoted
  decisions that did not exist. After the defendant said it could not find them and the court ordered
  copies, counsel submitted excerpts rather than genuine opinions and only admitted ChatGPT's role later.
  On 22 June 2023 Judge P. Kevin Castel found subjective bad faith by the two individual lawyers, imposed
  a USD 5,000 joint penalty including their firm, and ordered letters to the client and to the judges
  falsely named as authors.
failure_modes:
- hallucination-false-statements
severity: 3
harm_types:
- legal_liability
- misinformation
loss_estimate:
  amount: 5000
  currency: USD
  basis: Court-imposed penalty paid into the court registry, jointly and severally on respondents; excludes
    reputational and wasted-time costs.
  confidence: high
outcome:
  types:
  - sanctions
  - legal_ruling
  description: 'Rule 11 sanctions: USD 5,000 penalty, mandatory notification letters to the plaintiff
    and to each judge falsely identified as an author of the fake opinions.'
root_cause:
  attribution: court_or_regulator_finding
  description: The court found the attorney relied on ChatGPT as his only substantive source, did not
    verify the cases (including after being unable to locate one), and that ChatGPT, when asked, said
    the cases were real. The sanction was grounded in the lawyers' bad-faith conduct after the problem
    surfaced, not in using AI per se.
