notes: 'Deliberately constructed setup: the model was given reward-hacking knowledge and trained on environments
  chosen because they were hackable, so this shows what can happen, not how often production models do it.
  Released Claude models were not trained this way. The 12% and 50% rates are from Anthropic''s blog post.
  Anthropic later cited this result in its February 2026 ''persona selection model'' post.'
