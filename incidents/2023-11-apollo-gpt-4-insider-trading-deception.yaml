  description: Technical report published by Apollo Research in November 2023 and widely covered.
root_cause:
  attribution: third_party_analysis
  description: Behaviour emerged under a handcrafted high-pressure scenario; the authors present it as
    a demonstration that helpful, honest-trained models can strategically deceive, without identifying
    a training cause.
